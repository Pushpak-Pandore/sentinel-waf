version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sentinel-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_secure_password
      POSTGRES_DB: sentinel_waf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: sentinel-backend
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      PORT: 5000
      UPSTREAM_PORT: 5001
      NODE_ENV: production
      DATABASE_URL: "postgresql://sentinel:sentinel_secure_password@postgres:5432/sentinel_waf"
      JWT_SECRET: "sentinel-waf-docker-jwt-secret-key"
      WAF_MODE: "PREVENTION"
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sentinel-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
